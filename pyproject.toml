[project]
name = "superfaktura-mcp"
version = "0.1.0"
description = "MCP server for SuperFaktura (SK, CZ, AT): invoices, clients and expenses for AI assistants"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Filip Papranec", email = "filip@digitaliko.com"}
]
maintainers = [
    {name = "Digitaliko", email = "filip@digitaliko.com"}
]
keywords = ["mcp", "mcp-server", "superfaktura", "invoicing", "slovakia", "czech", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Accounting",
]

dependencies = [
    "fastmcp>=2.6.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
superfaktura-mcp = "server:main"

[project.urls]
Homepage = "https://github.com/Digitaliko/superfaktura-mcp"
Repository = "https://github.com/Digitaliko/superfaktura-mcp"
Issues = "https://github.com/Digitaliko/superfaktura-mcp/issues"
Documentation = "https://github.com/superfaktura/docs"
"API Reference" = "https://github.com/xseman/superfaktura.openapi"

[dependency-groups]
dev = ["pytest>=8", "tomli>=2; python_version < '3.11'"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# ponytail: one top-level module named "server"; fine in uvx's isolated env, a package
# (superfaktura_mcp/) is the upgrade if this is ever imported next to other code.
py-modules = ["server"]
